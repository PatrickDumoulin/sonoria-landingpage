    <!-- Structured Data - FAQPage -->
    <script type="application/ld+json">
    {

        {
          "@type": "Question",
          "name": "À qui s'adresse Sonoria ?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Sonoria s'adresse aux PME des secteurs manufacturier, agroalimentaire et construction au Québec. Nos clients typiques : directeurs d'usine, Plant Managers, directeurs des opérations et CEO de PME qui veulent récupérer de la capacité, améliorer leur visibilité opérationnelle et sécuriser leur savoir-faire sans perturber leurs équipes."
          }
        },
        {
          "@type": "Question",
          "name": "Quels résultats concrets peut-on espérer avec Sonoria ?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Nos clients récupèrent typiquement 20-30 % de capacité grâce à l'automatisation des tâches manuelles. Nous avons généré plus de 700 000 $ de valeur opérationnelle pour nos clients à ce jour. Les résultats sont mesurables dès les 90 premiers jours, avec des indicateurs définis ensemble dès le départ."
          }
        },
        {
          "@type": "Question",
          "name": "Qu'est-ce qu'ExpertSync et à quoi ça sert ?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "ExpertSync est notre produit phare : il transforme vos manuels techniques, procédures et guides opérationnels en un assistant IA déployé directement dans votre environnement. Vos employés obtiennent des réponses instantanées citées depuis vos propres documents. Déploiement en 7-14 jours, sur site (on-premise) pour que vos données restent chez vous."
          }
        },
        {
          "@type": "Question",
          "name": "Est-ce que l'intégration de l'IA perturbe mes opérations ?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Non. Sonoria s'intègre à vos outils existants (ERP, SharePoint, OneDrive, Google Drive) sans migration ni refonte de vos systèmes. Notre approche est conçue pour zéro perturbation : semaines 1-2 pour le diagnostic, semaines 3-8 pour l'intégration sur mesure, puis mesure des résultats en continu."
          }
        },
        {
          "@type": "Question",
          "name": "Comment fonctionne l'intelligence opérationnelle de Sonoria ?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Sonoria connecte vos données de production existantes pour créer des tableaux de bord en temps réel, déclencher des alertes proactives sur les anomalies qualité avant qu'elles coûtent cher, et transformer des données brutes inutilisées en décisions basées sur les faits. 80 % des données opérationnelles des PME ne sont jamais analysées — on change ça."
          }
        },
        {
          "@type": "Question",
          "name": "Par où commencer avec Sonoria ?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "On commence par un diagnostic opérationnel gratuit de 30 minutes. Ensemble, on identifie vos 3 meilleures opportunités d'IA, on évalue l'impact potentiel et on définit une feuille de route réaliste. Aucun jargon technique, aucun pitch de vente. Juste un regard honnête sur ce que l'IA peut faire pour vous."
          }
        }
      ]
